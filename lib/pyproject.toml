[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-darktrace-connector"
version = "1.0.0"
description = "Detección de amenazas en la red con Darktrace: consultar modelos, obtener alertas (model breaches), consultar incidentes de Cyber AI Analyst y reconocer alertas"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_darktrace_connector*"]
